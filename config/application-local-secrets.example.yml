# Copy to application-local-secrets.yml and fill local values.
# application-local-secrets.yml is gitignored and MUST NOT be committed.
spring:
  mail:
    username: "<MAILTRAP_USERNAME>"
    password: "<MAILTRAP_PASSWORD>"

regional:
  confirmation:
    hmac:
      active-key-version: v1
      keys: "v1:<BASE64_32_BYTE_LOCAL_HMAC_KEY>"
