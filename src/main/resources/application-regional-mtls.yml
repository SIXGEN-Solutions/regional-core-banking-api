# Activated only with the explicit regional-mtls Spring profile.
# TLS terminates in Spring Boot; the client certificate is mandatory.
spring:
  config:
    activate:
      on-profile: regional-mtls
  ssl:
    bundle:
      jks:
        regional-server:
          keystore:
            location: ${REGIONAL_MTLS_KEYSTORE_LOCATION}
            password: ${REGIONAL_MTLS_KEYSTORE_PASSWORD}
            type: PKCS12
          truststore:
            location: ${REGIONAL_MTLS_TRUSTSTORE_LOCATION}
            password: ${REGIONAL_MTLS_TRUSTSTORE_PASSWORD}
            type: PKCS12
server:
  ssl:
    enabled: true
    bundle: regional-server
    client-auth: need
    enabled-protocols: TLSv1.3
regional:
  security:
    mtls:
      # One or more comma-separated SHA-256 fingerprints, for planned rotation.
      # NO default: missing allowlist makes secure startup fail.
      allowed-client-cert-sha256: ${REGIONAL_MTLS_ALLOWED_CLIENT_CERT_SHA256}
