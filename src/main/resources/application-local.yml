# Local developer profile only.
# Secrets are loaded from the ignored ./config/application-local-secrets.yml.
spring:
  config:
    import: optional:file:./config/application-local-secrets.yml
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 587
    properties:
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

regional:
  technical-datasource:
    url: jdbc:postgresql://localhost:15434/regional_core_banking?currentSchema=core_banking
    username: regional_core_banking_app
    password: regional_core_banking_dev
  confirmation:
    persistence: jdbc
    email:
      enabled: true
      sender: no-reply@regional-test.local
      test-recipient: customer@regional-test.local
