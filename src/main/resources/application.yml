spring:
  application:
    name: regional-core-banking-api
  datasource:
    url: ${REGIONAL_TECHNICAL_DB_URL}
    username: ${REGIONAL_TECHNICAL_DB_USERNAME}
    password: ${REGIONAL_TECHNICAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

regional:
  confirmation:
    persistence: jdbc

