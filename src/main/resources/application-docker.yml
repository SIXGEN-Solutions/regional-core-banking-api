# Local Docker Compose runtime only.
# Oracle below is test infrastructure and does not establish production
# Amplitude/Informix mappings.

regional:
  technical-datasource:
    url: ${REGIONAL_TECHNICAL_DB_URL:jdbc:postgresql://localhost:5432/regional_core_banking?currentSchema=core_banking}
    username: ${REGIONAL_TECHNICAL_DB_USERNAME:regional_core_banking_app}
    password: ${REGIONAL_TECHNICAL_DB_PASSWORD}

  banking:
    database:
      vendor: oracle
    financial-institution-code: REGIONAL
    datasource:
      url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//customer-oracle:1521/FREEPDB1}
      username: ${ORACLE_APP_USERNAME:REGIONAL_MOCK}
      password: ${ORACLE_APP_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver

  confirmation:
    persistence: jdbc

    hmac:
      active-key-version: ${REGIONAL_OTP_HMAC_ACTIVE_KEY_VERSION}
      keys: ${REGIONAL_OTP_HMAC_KEYS}

    email:
      enabled: ${REGIONAL_OTP_EMAIL_ENABLED:false}
      sender: ${REGIONAL_OTP_EMAIL_SENDER:no-reply@regional-docker.local}
      host: ${REGIONAL_OTP_EMAIL_HOST}
      port: ${REGIONAL_OTP_EMAIL_PORT:587}
      username: ${REGIONAL_OTP_EMAIL_USERNAME}
      password: ${REGIONAL_OTP_EMAIL_PASSWORD}
      tls: ${REGIONAL_OTP_EMAIL_TLS:true}
  security:
    mtls:
      enabled: ${ENABLE_MTLS:false}
      # One or more comma-separated SHA-256 fingerprints, for planned rotation.
      allowed-client-cert-sha256: ${SECURITY_MTLS_ALLOWED_CLI_CERT:}
      required: ${REGIONAL_MTLS_REQUIRED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
# Docker-only HTTP is the default; provide certificates when ENABLE_MTLS=true.
server:
  ssl:
    # No eagerly created spring.ssl.bundle. Both toggles use ENABLE_MTLS.
    enabled: ${ENABLE_MTLS:false}
    key-store: ${REGIONAL_MTLS_KEYSTORE_LOCATION:}
    key-store-password: ${REGIONAL_MTLS_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    trust-store: ${REGIONAL_MTLS_TRUSTSTORE_LOCATION:}
    trust-store-password: ${REGIONAL_MTLS_TRUSTSTORE_PASSWORD:}
    trust-store-type: PKCS12
    client-auth: need
    enabled-protocols: TLSv1.3
