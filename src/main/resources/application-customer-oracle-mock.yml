spring:
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: REGIONAL_MOCK
    password: ${ORACLE_APP_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 5000

regional:
  banking:
    database:
      vendor: oracle
    financial-institution-code: REGIONAL

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
