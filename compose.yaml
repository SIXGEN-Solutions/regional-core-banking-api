services:
  postgres:
    image: postgres:16-alpine
    container_name: regional-core-banking-postgres
    environment:
      POSTGRES_DB: regional_core_banking
      POSTGRES_USER: regional_core_banking_app
      POSTGRES_PASSWORD: ${REGIONAL_TECHNICAL_DB_PASSWORD:-regional_core_banking_dev}
    ports:
      - "${REGIONAL_POSTGRES_PORT:-15434}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U regional_core_banking_app -d regional_core_banking"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - regional-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/001_create_core_banking_schema.sql:/docker-entrypoint-initdb.d/001_create_core_banking_schema.sql:ro
    restart: unless-stopped

  customer-oracle:
    image: gvenzl/oracle-free:23.26.1-slim-faststart
    container_name: regional-customer-oracle
    environment:
      ORACLE_RANDOM_PASSWORD: "true"
      APP_USER: ${ORACLE_APP_USERNAME:-REGIONAL_MOCK}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-regional_oracle_dev}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - ./docker/customer-oracle/001_customer_schema.sql:/container-entrypoint-initdb.d/001_customer_schema.sql:ro
      - regional-oracle-data:/opt/oracle/oradata
    restart: unless-stopped

  regional-core-banking-api:
    image: ${REGIONAL_API_IMAGE:-d22002/regional-core-banking-api:latest}
    pull_policy: always
    container_name: regional-core-banking-api

    depends_on:
      postgres:
        condition: service_healthy
      customer-oracle:
        condition: service_healthy

    ports:
      - "${REGIONAL_API_PORT:-9092}:9092"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      # Spring Boot listens on 9092 inside the container.
      SERVER_PORT: 9092

      # Regional technical PostgreSQL database.
      # Docker services communicate through the internal Docker network,
      # therefore PostgreSQL remains reachable on its container port 5432.
      REGIONAL_TECHNICAL_DB_URL: jdbc:postgresql://postgres:5432/regional_core_banking?currentSchema=core_banking
      REGIONAL_TECHNICAL_DB_USERNAME: regional_core_banking_app
      REGIONAL_TECHNICAL_DB_PASSWORD: ${REGIONAL_TECHNICAL_DB_PASSWORD:-regional_core_banking_dev}

      # Customer Oracle mock.
      ORACLE_JDBC_URL: jdbc:oracle:thin:@//customer-oracle:1521/FREEPDB1
      ORACLE_APP_USERNAME: ${ORACLE_APP_USERNAME:-REGIONAL_MOCK}
      ORACLE_APP_PASSWORD: ${ORACLE_APP_PASSWORD:-regional_oracle_dev}

      # OTP HMAC configuration.
      REGIONAL_OTP_HMAC_ACTIVE_KEY_VERSION: ${REGIONAL_OTP_HMAC_ACTIVE_KEY_VERSION:-v1}
      REGIONAL_OTP_HMAC_KEYS: ${REGIONAL_OTP_HMAC_KEYS:-v1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

      # OTP EMAIL delivery enabled for Docker integration testing.
      # Real SMTP credentials are loaded from the ignored local .env file.
      REGIONAL_OTP_EMAIL_ENABLED: "${REGIONAL_OTP_EMAIL_ENABLED:-true}"
      REGIONAL_OTP_EMAIL_SENDER: "${REGIONAL_OTP_EMAIL_SENDER:-no-reply@regional-test.local}"
      REGIONAL_OTP_EMAIL_HOST: "${REGIONAL_OTP_EMAIL_HOST:?REGIONAL_OTP_EMAIL_HOST must be set}"
      REGIONAL_OTP_EMAIL_PORT: "${REGIONAL_OTP_EMAIL_PORT:-587}"
      REGIONAL_OTP_EMAIL_USERNAME: "${REGIONAL_OTP_EMAIL_USERNAME:?REGIONAL_OTP_EMAIL_USERNAME must be set}"
      REGIONAL_OTP_EMAIL_PASSWORD: "${REGIONAL_OTP_EMAIL_PASSWORD:?REGIONAL_OTP_EMAIL_PASSWORD must be set}"
      REGIONAL_OTP_EMAIL_TLS: "${REGIONAL_OTP_EMAIL_TLS:-true}"

    restart: unless-stopped

volumes:
  regional-postgres-data:
  regional-oracle-data: