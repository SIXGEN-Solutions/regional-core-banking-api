services:
  test-postgres:
    image: postgres:16-alpine
    container_name: regional-core-banking-test-postgres
    environment:
      POSTGRES_DB: regional_core_banking_test
      POSTGRES_USER: regional_core_banking_test
      POSTGRES_PASSWORD: ${REGIONAL_CONFIRMATION_TEST_POSTGRES_PASSWORD:-regional_core_banking_test}
    ports:
      - "${REGIONAL_CONFIRMATION_IT_DB_PORT:-15433}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U regional_core_banking_test -d regional_core_banking_test
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - ./docker/test-postgres/001_create_core_banking_schema.sql:/docker-entrypoint-initdb.d/001_create_core_banking_schema.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
