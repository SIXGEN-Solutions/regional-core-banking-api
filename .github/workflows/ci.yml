name: Regional Core Banking API CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Maven, container and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Approved Regional contract guard
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT=contracts/openapi/regional-core-banking-api-v1.yaml
          grep -Eq '^[[:space:]]*approvalStatus:[[:space:]]*APPROVED[[:space:]]*$' "$CONTRACT"
          grep -Eq '^[[:space:]]*codeGenerationAllowed:[[:space:]]*true[[:space:]]*$' "$CONTRACT"

      - name: Maven version
        run: mvn --version

      - name: Maven verify
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker image build validation (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          tags: regional-core-banking-api:ci-${{ github.sha }}

      - name: Validate Docker Compose configuration (no deployment)
        env:
          REGIONAL_OTP_EMAIL_HOST: smtp.example.invalid
          REGIONAL_OTP_EMAIL_USERNAME: ci-placeholder
          REGIONAL_OTP_EMAIL_PASSWORD: ci-placeholder
        run: docker compose config --quiet

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@v4
