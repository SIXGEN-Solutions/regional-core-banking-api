name: Regional Core Banking API CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

env:
  DOCKER_IMAGE: d22002/regional-core-banking-api

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Contract approval guard
        shell: bash
        run: |
          grep -q "approvalStatus: APPROVED" contracts/openapi/regional-core-banking-api-v1.yaml
          grep -q "codeGenerationAllowed: true" contracts/openapi/regional-core-banking-api-v1.yaml

      - name: Maven verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute Docker image tag
        id: docker-tag
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::6}"
          IMAGE="${DOCKER_IMAGE}:${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Docker image tag::${IMAGE}"

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ steps.docker-tag.outputs.short_sha }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

      - name: Report published Docker image
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "::notice title=Docker image published::${{ steps.docker-tag.outputs.image }}"
          echo "REGIONAL_API_IMAGE=${{ steps.docker-tag.outputs.image }}"

      - name: Validate Docker Compose configuration
        env:
          REGIONAL_OTP_EMAIL_HOST: smtp.example.invalid
          REGIONAL_OTP_EMAIL_USERNAME: ci-placeholder
          REGIONAL_OTP_EMAIL_PASSWORD: ci-placeholder
        run: docker compose config --quiet

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
